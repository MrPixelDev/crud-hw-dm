services:
  postgres:
    image: postgres:16-alpine
    container_name: nest-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nest-auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest-auth']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server --address ":10000" --console-address ":10001" /data
    ports:
      - '10000:10000'
      - '10001:10001'
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  redis:
    image: redis:alpine3.16
    container_name: redis-wsbe
    env_file: .env
    command: >
      --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    restart: unless-stopped

volumes:
  postgres_data:
  minio_storage:
